[package]
name = "folio-desktop"
version = "1.12.0"
description = "Folio · NovelAI 本地图像工作台"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "Folio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3"
serde_json = "1"
tauri = { version = "2", features = ["custom-protocol"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
